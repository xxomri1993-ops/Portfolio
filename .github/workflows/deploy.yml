name: Deploy to GitHub Pages

# Publishes the site on every push to the working branch. In the repository's
# Settings → Pages, set "Source" to "GitHub Actions" once and this takes over.
on:
  push:
    branches:
      - claude/omri-portfolio-website-lhw4vk
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # The site is plain HTML/CSS/JS at the repo root — nothing to build.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
